# Every assumption used in the analysis. Edit here, not in code.
# status: observed = published figure | derived = computed by us | assumed = our choice (scenario)

meta:
  as_of: 2026-10-27
  analysis_years: [2026, 2027, 2028]
  scenarios: [low, mid, high]

# ---------------------------------------------------------------- MEDICAID
medicaid:
  baseline_aca_adults:
    value: 364204
    status: observed
    note: Cook County ACA adults enrolled June 30 2025 (FY2025)
    source: "https://hfs.illinois.gov/info/factsfigures/program-enrollment/cook.html"
  baseline_total_enrollees:
    value: 1535983
    status: observed
    source: "https://hfs.illinois.gov/info/factsfigures/program-enrollment/cook.html"

  work_requirement:
    effective_date:
      value: 2027-01-01
      status: observed
      source: "https://www.dhs.state.il.us/page.aspx?item=180030"
    first_renewals_checked:
      value: 2027-03
      status: observed
      note: existing enrollees verified at redeterminations due March 2027 onward
      source: "https://www.dhs.state.il.us/page.aspx?item=180030"
    response_window_days:
      value: 30
      status: observed
      source: "https://hfs.illinois.gov/content/dam/soi/en/web/hfs/medicalclients/medicaidguide/ACAAdultCustomerNotice083126ToPrint.pdf"
    first_loss_month:
      value: 2027-04
      status: derived
      note: March renewals + 30-day response window
    renewal_months_per_cycle:
      value: 6
      status: observed
      source: "https://hfs.illinois.gov/info/fedresctr/faqshowwillfedchimpactmedicaid.html"
    initial_renewals_spread_months:
      value: 12
      status: assumed
      note: existing caseload's first 2027 renewals assumed spread evenly over 12 months starting March 2027
    income_test_monthly:
      value: 580
      status: observed
      note: 80 hrs x federal minimum wage $7.25
      source: "https://hfs.illinois.gov/content/dam/soi/en/web/hfs/info/fedresctr/hr1mod3wrce.pdf"
    hours_test_weekly:
      value: 20
      status: derived
      note: 80 hrs/month ~= 18.5 hrs/week; PUMS WKHP>=20 used as proxy

  # Loss rates. All three apply to the SAME base, people SUBJECT to the work
  # requirement (not exempt), so the scenarios can be compared. Paperwork loss
  # among exempt people and extra churn from 6-month renewals are separate
  # parameters below, so they aren't counted twice.
  # Decision 2026-10-29 (user): replaces the unsourced 19/30/40% (came with the original prompt as "user-supplied").
  # Work-requirement losses (subject adults + exempt paperwork losses) = Urban/RWJF Illinois "work requirements
  # after six-month redetermination" share of ALL ACA adults (Table A.2): 18% / 29% / 42%. The subject loss rate is
  # derived in 04_medicaid: (Urban share x baseline - paperwork losses) / subject people (~38% / ~58% / ~82%).
  # Scenario map: our low/mid/high = Urban high/medium/low mitigation. Illinois's announced choices match Urban's
  # high-mitigation settings on all 5 decided dimensions (output/tables/illinois_vs_urban_scenarios.csv); mid/high
  # reflect poorer response by enrollees (Urban: 65/75/87% of manual verifiers don't respond; Arkansas/NH evidence).
  loss_rate_subject:
    low:  {value: from_urban_il_work_req, urban_scenario: high, status: derived}
    mid:  {value: from_urban_il_work_req, urban_scenario: medium, status: derived}
    high: {value: from_urban_il_work_req, urban_scenario: low, status: derived}
    source: "https://www.rwjf.org/content/dam/farm/reports/reports/2026/rwjf485284"
    note: Base = adults subject to the work requirement (derived). Old unsourced values were 0.19 / 0.30 / 0.40.
  loss_rate_exempt_paperwork:
    low:  {value: 0.00, status: assumed}
    mid:  {value: 0.03, status: assumed}
    high: {value: 0.06, status: assumed}
    note: exempt adults disenrolled because the exemption was not documented in time
  # Decision 2026-10-28 (user): replaces the unsourced 0/2/4% churn placeholder.
  six_month_renewal_loss:
    low:  {value: from_urban_il_redet, urban_scenario: high, status: derived}
    mid:  {value: from_urban_il_redet, urban_scenario: medium, status: derived}
    high: {value: from_urban_il_redet, urban_scenario: low, status: derived}
    source: "https://www.rwjf.org/content/dam/farm/reports/reports/2026/rwjf485284"
    note: >-
      Share of ALL ACA adults off coverage because renewals move from yearly to every 6 months, net of
      re-enrollment. Illinois 'six-month redeterminations only' from Urban Institute/RWJF (Buettgens et al.
      2026), Table A.2: 8% (high mitigation) / 15% (medium) / 15% (low), calibrated to 2025 state procedural
      disenrollment. Our scenario low/mid/high = Urban high/medium/low mitigation. Applied as Cook = Illinois rate.
      Timing: each renewal cohort's first 6-month renewal (Sept 2027-Aug 2028) adds rate/12 of the people still
      enrolled, losses the next month; full level reached Sept 2028 and held (Urban reports a level, not a flow).
  verification_increase_2028:
    low:  {value: 0.0, status: assumed}
    mid:  {value: 0.0, status: assumed}
    high: {value: 0.0, status: assumed}
    note: >-
      Set to 0 on 2026-10-29: Urban's 2028 work-requirement estimate already includes ongoing verification, so a
      separate 2028 add-on would double count (was an unsourced 0/5/10% placeholder).
  hfs_internal_estimate:
    low:  {value: 165000, status: observed}
    high: {value: 330000, status: observed}
    aca_adults_subject: {value: 700000, status: observed}
    source: "https://hfs.illinois.gov/content/dam/soi/en/web/hfs/info/fedresctr/hr1mod3wrce.pdf"
    note: "HFS draft webinar Module 3 (Jul 14 2026) p8: 'Internal estimates show that between 165,000 and 330,000 Illinoisans will lose Medicaid coverage due to the new federal work requirements'. Method not published; triangulation only."
  # How the work-requirement rules are applied to ACS PUMS records (step 4, src/lib/pums_rules.py).
  pums_rules:
    # Decision 2026-10-28 (user): broad universe is the headline; PUMS only supplies SHARES, applied to the HFS
    # count. The plan's narrow universe (POVPIP<=138 + no child <18 in the home) matched 25% of HFS enrollment
    # vs 82% for the broad one; it is kept as the 'plan_universe' sensitivity.
    poverty_limit_pct:
      value: null
      status: assumed
      note: >-
        no income filter. ACA limit is 138% FPL on monthly MAGI of the tax household; PUMS POVPIP is annual
        family income, which screens out many enrollees (e.g. adults living with working parents)
    child_rule:
      value: caretaker
      status: assumed
      note: >-
        HFS ACA adult = not the parent/caretaker of a child <18 in the home. 'caretaker' excludes the reference
        person, spouse or partner when a child <18 lives there; 'household' (sensitivity) excludes everyone in the home.
    half_time_student:
      value: compliant
      status: assumed
      source: "user decision 2026-10-28: follow HFS (school is a way to comply), overrides PLAN.md item 2"
      note: >-
        PLAN lists half-time school as an exemption; HFS lists it as a way to comply. 'exempt' removes students from
        share (a); 'compliant' keeps them in (a) and removes them from (b). Both are reported.
    veteran_rating_code:
      value: "5"
      status: assumed
      note: PUMS DRAT 5 = 70-100% rating; H.R. 1 exempts a total (100%) rating, which PUMS cannot isolate
    snap_tanf_proxy:
      value: "PAP>0 and employed, or SNAP household (FS=1) and meets 80-hour rule"
      status: assumed
      note: H.R. 1 exempts people meeting SNAP or TANF work rules; PUMS has no direct flag
  unmodeled_exemptions_share:
    value: 0.02
    status: assumed
    note: SUD treatment, recently incarcerated, former foster youth <26 (no PUMS proxy)

  noncitizen:
    statewide_loss:
      value: 9300
      status: observed
      effective_date: 2026-10-01
      source: "https://www.illinois.gov/content/dam/soi/en/web/illinois/iisnewsattachments/33039-101426-gci-noncitizen-loss-of-medicaid-sep-pr-003.pdf.pdf"
    cook_share:
      # Decision 2026-10-28: use the Census share (Cook / Illinois noncitizens, ACS B05001) for mid and high.
      low:  {value: 0.44, status: observed, source: "https://www.cbsnews.com/chicago/news/noncitizens-illinois-losing-medicaid-benefits/", note: "CBS Chicago: 'about 44% are in Cook County' (wording ambiguous)"}
      mid:  {value: from_acs_noncitizen_share, status: derived, note: "ACS 2020-24 B05001_006 Cook / Illinois (~0.60); computed in pipeline"}
      high: {value: from_acs_noncitizen_share, status: derived}

  dollars:
    federal_match_aca:
      value: 0.90
      status: observed
    pmpm_countycare_aca:
      value: null   # filled by src/ from CCH deck: ACA capitation / members / 12
      status: derived
      inputs: {capitation_usd: 700000000, members: 69768}
      source: "https://cookcountyhealth.org/wp-content/uploads/Prelim-FY27-CCH-Budget-Presentation-Final.pdf"
      todo: confirm both inputs against the deck
    pmpm_hfs_statewide_aca:
      value: null
      status: observed
      todo: find HFS ACA adult per-member cost (HFS annual report / MCO rate certification)

# ---------------------------------------------------------------- SNAP
snap:
  time_limit:
    waiver_end: {value: 2026-01-31, status: observed, source: "https://www.dhs.state.il.us/page.aspx?item=175082"}
    clock_start: {value: 2026-02-01, status: observed, source: "https://www.dhs.state.il.us/page.aspx?item=175082"}
    first_cutoff: {value: 2026-05-01, status: observed, source: "https://www.dhs.state.il.us/page.aspx?item=176106"}
    period_type: {value: fixed, status: observed, note: "Jan 1 2024 - Dec 31 2026; new period Jan 1 2027"}
    second_wave_cutoff: {value: 2027-04-01, status: derived, note: "countable months Jan-Mar 2027"}
    ages: {value: [18, 64], status: observed}
    child_exempt_under: {value: 14, status: observed}
    statewide_newly_time_limited: {value: 450000, status: observed, note: "IDHS estimate via GCFD (Jul 2025): ABAWD pool 190k -> ~450k; >340k at risk"}
    # Second wave (April 2027). rate = observed first-wave excess drop / time-limited pool (PUMS share x Apr 2026
    # caseload); wave 2 = rate x multiplier x pool in early 2027 (PUMS share x projected caseload). Computed in 05_snap.
    calibration_window:
      value: ["2026-05", "2026-06"]
      status: assumed
      source: "params.yaml decision 2026-10-28"
      note: >-
        Excess drop beyond the mid trend, May-June 2026 (62k office basis). Matches IDHS's ~148k statewide
        work-requirement losses by ~June 2026 x Cook ~45% = ~67k. May only (43k) and May-Sept (102k) are sensitivities.
    caseload_projection:
      value: flat_from_latest
      status: assumed
      note: Cook SNAP persons held at the latest IDHS month (Sept 2026) until the second wave; no further trend
    calibration_multipliers: {low: 1.0, mid: 1.0, high: 1.0, status: assumed, note: "set to 1.0 on 2026-10-28; scenarios now differ by pool (second_wave_pool)"}
    # Decision 2026-10-28 (user): who can be cut in April 2027.
    second_wave_pool:
      low:  {value: survivors, status: assumed, note: "only time-limited adults who survived wave 1 (pool 2026 - wave-1 losses); no new entrants"}
      mid:  {value: midpoint, status: assumed, note: "average of low and high pools (user: 35-40k expected; CBPP Oct 2026: caseloads still falling)"}
      high: {value: refilled, status: assumed, note: "PLAN: PUMS time-limited share x projected caseload (pool fully refilled by new entrants/returners)"}
      source: "https://www.cbpp.org/blog/snap-participation-has-dropped-to-its-lowest-point-in-17-years-even-though-economic-conditions"

  noncitizen:
    effective_date: {value: 2026-04-01, status: observed}
    statewide_loss:
      value: 20000
      status: observed
      note: IDHS estimate cited by Greater Chicago Food Depository (Jul 2025); advocacy range 14,000-16,000
      source: "https://www.chicagosfoodbank.org/wp-content/uploads/2025/07/HR1-Budget-Reconciliation-Analysis-of-SNAP-Cuts-and-Illinois-Impact_7.10.25.pdf"
    cook_share:
      low:  {value: 0.44, status: observed, source: "https://www.cbsnews.com/chicago/news/noncitizens-illinois-losing-medicaid-benefits/", note: "reuse Medicaid noncitizen share"}
      mid:  {value: from_acs_noncitizen_share, status: derived}
      high: {value: from_acs_noncitizen_share, status: derived}

  # Which months' declines count as H.R. 1 (observed SNAP drop beyond the pre-H.R. 1 trend):
  attribution_start:
    low:  {value: "2026-02", status: observed, source: "https://www.dhs.state.il.us/page.aspx?item=176589", note: "legal start of time limit after court ruling (IDHS IM 01/15/2026)"}
    mid:  {value: "2025-12", status: observed, source: "https://www.dhs.state.il.us/page.aspx?item=176589", note: "IDHS first applied H.R. 1 work requirement Dec 2025 (countable months recorded, later removed; CN 26.01)"}
    high: {value: "2025-10", status: assumed, source: "params.yaml decision 2026-10-28", note: "every month after the Sept 2025 baseline, flat counterfactual"}
  triangulation:
    statewide_work_req_losses_by_jun_2026: {value: 148000, status: observed, source: "https://chicago.suntimes.com/la-voz/2026/07/30/illinois-registra-una-caida-del-16-en-la-inscripcion-en-snap-un-ano-despues-de-los-cambios-al-programa", note: "IDHS estimate; plus 157,000 lost for other reasons"}
    statewide_initial_projection: {value: 400000, status: observed, source: "same Sun-Times article", note: "state officials' initial estimate"}

  # IDHS has two Cook counts. County PDF (by residence) 881,937 vs servicing-office table 851,244 (Sept 2025).
  # Decision 2026-10-28: we measure Cook RESIDENTS, so office-based changes are scaled to a residence basis by the
  # Sept 2025 ratio. Assumes the ratio is stable over time (only one month of county data is available).
  residence_adjustment:
    low:  {value: 1.0, status: assumed, source: "params.yaml decision 2026-10-28", note: "office basis (no adjustment)"}
    mid:  {value: from_sept2025_county_office_ratio, status: derived}
    high: {value: from_sept2025_county_office_ratio, status: derived}

  # Decision 2026-10-28 (user): OUT OF SCOPE for totals. These rules cut benefits for people who stay on SNAP;
  # they are small next to coverage losses (LIHEAP/SUA ~1-3% of SNAP $ even at 20-50k households; internet $0-5).
  # Kept for reference (LIHEAP per-household cut table) and described in methods.md.
  benefit_cuts_still_enrolled:
    in_scope: {value: false, status: assumed, source: "user decision 2026-10-28"}
    liheap_sua:
      # Affected: SNAP households with no Qualifying Member (60+ or disabled) that got the A/C-Heating standard ONLY
      # because of a LIHEAP payment >= $21, i.e. they pay no heat/AC bill themselves (e.g. heat included in rent).
      # They move to the standard their own bills support. Households billed for heat/AC keep the A/C-Heating standard.
      effective_date: {value: 2025-09-26, status: observed, source: "https://www.dhs.state.il.us/page.aspx?item=16169", note: "new cases / new utility expense; existing cases at next redetermination (12-month phase-in)"}
      heating_cooling_sua_monthly: {value: 565, status: observed, source: "https://www.dhs.state.il.us/page.aspx?item=21738"}
      utility_standards:
        fy2026: {ac_heat: 546, limited: 457, single: 78, telephone: 67, status: observed, source: "https://www.dhs.state.il.us/page.aspx?item=171481", note: "MR #25.33, Oct 2025 issuances"}
        fy2027: {ac_heat: 565, limited: 472, single: 80, telephone: 69, status: observed, source: "https://www.dhs.state.il.us/page.aspx?item=21738", note: "WAG 25-03-02 (1), 10/2026"}
      benefit_reduction_rate: {value: 0.30, status: observed, note: "SNAP benefit falls by 30% of each $1 of net income (7 U.S.C. 2017(a))"}
      max_excess_shelter_no_qm: {value: 769, status: observed, source: "https://www.dhs.state.il.us/page.aspx?item=16164", note: "cap for households without a Qualifying Member; at the cap, a lower SUA may cut nothing"}
      fallback_standard:
        low:  {value: limited, status: assumed, note: "billed for 2+ non-heat utilities (e.g. electricity + phone)"}
        mid:  {value: limited, status: assumed}
        high: {value: telephone, status: assumed, note: "only a phone bill"}
      # Per-household cut = benefit_reduction_rate x (ac_heat - fallback). An upper bound: the 50%-of-income rule and
      # the $769 cap can make it smaller. Not the pasted "$100/month (FRAC/CBO)" figure, which is unverified.
      share_households_affected:
        low:  {value: null, status: assumed}
        mid:  {value: null, status: assumed}
        high: {value: null, status: assumed}
        todo: >-
          need the number/share of Cook SNAP households with no Qualifying Member that got the A/C-Heating standard
          only via LIHEAP (IDHS administrative data; not published). PUMS upper bound for 'no 60+/disabled member' is
          41% of SNAP households, but most of those pay heat/AC bills and are not affected.
    internet_sua:
      monthly_benefit_cut_per_household:
        low:  {value: 0, status: assumed}
        mid:  {value: 0, status: assumed}
        high: {value: 5, status: assumed}
        note: GCFD calls it a 'small SNAP cut for thousands'; Illinois inclusion of internet in SUA not confirmed
      applies_to: {value: all_remaining_snap_households, status: assumed, note: "upper bound; only the high scenario is non-zero"}
      start_month: {value: "2026-01", status: assumed, note: "Illinois effective date not confirmed"}
    thrifty_food_plan_cola_restraint:
      value: 0
      status: assumed
      note: future benefit-level restraint; left at 0 for 2026-2028

  dollars:
    avg_benefit_person_month:
      value: 195
      status: observed
      note: Illinois, May 2026; replace with IDHS issuance data if available
      source: "https://civicfed.org/blog/illinois-fails-lower-snap-payment-error-rates-targeted-hr-1"

  state_cost_share:
    error_rate_fy2025: {value: 0.1467, status: observed, note: "13.33% over + 1.33% under; FY2024 = 11.56%"}
    error_rate_fy2026: {value: null, status: unknown, note: "USDA release ~June 2027"}
    benefit_share_if_error_ge_10pct: {value: 0.15, status: observed}
    delay_threshold: {value: 0.1334, status: observed, note: "error rate x 1.5 >= 20% -> delayed start"}
    start_scenarios:
      early: {value: 2028-10-01, status: derived, note: "FY2029 delayed start (FY2025 rate >= 13.34%)"}
      late:  {value: 2029-10-01, status: derived, note: "FY2030 if FY2026 rate also >= 13.34%"}
    admin_state_share:
      value: 0.75
      effective_date: 2026-10-01
      status: observed
      statewide_annual_cost_increase: {value: 80000000, status: observed, source: "https://civicfed.org/node/5122"}

